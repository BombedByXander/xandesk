[workspace]
members = ["crates/protocol", "crates/relay", "crates/host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
arcdesk-protocol = { path = "crates/protocol" }
rand = "0.8"

[profile.release]
lto = "thin"
strip = true


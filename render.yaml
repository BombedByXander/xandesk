services:
  - type: web
    name: xandesk-relay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ARCDESK_BIND
        value: 0.0.0.0:10000
      - key: ARCDESK_ORIGINS
        value: https://xandesk.pages.dev
      - key: XANDESK_SUPABASE_URL
        value: https://sgqiynszzggnfzjsncyl.supabase.co
      - key: XANDESK_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_gEifLcFwIi6C-zfuyrPfUQ_gMQpbrj3
      - key: XANDESK_RELAY_PUBLIC_URL
        fromService:
          type: web
          name: xandesk-relay
          envVarKey: RENDER_EXTERNAL_URL
      - key: ARCDESK_ICE_SERVERS
        value: '[{"urls":["stun:stun.l.google.com:19302"]}]'
